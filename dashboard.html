<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Kasir - Kintoun Cafe</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#11263d',      
                        ivory: '#F9F8F6',        // Diperterang agar lebih clean/putih
                        taupe: '#938370',        
                        secondary: '#4A5C6A',    // Dibuat lebih soft
                        coolGrey: '#A0ABBA', 
                        muted: '#B8AD98', 
                        lightBeige: '#E5E1D8'    // Border lebih soft
                    },
                    fontFamily: { 
                        sans: ['Poppins', 'sans-serif'],
                        comfortaa: ['Comfortaa', 'cursive']
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-primary text-ivory font-sans min-h-screen flex flex-col">

    <!-- =========================================
         1. LAYAR LOGIN / PILIH STORE
    ========================================== -->
    <div id="loginScreen" class="fixed inset-0 z-50 bg-primary flex items-center justify-center p-5 transition-opacity duration-500">
        <div class="bg-white rounded-3xl shadow-xl w-full max-w-sm p-8 text-center border border-lightBeige relative overflow-hidden">

            <div class="relative z-10">
                <h2 class="font-poppins font-extrabold text-3xl text-primary tracking-wider uppercase mb">KINTOUN</h2>
                <p class="font-poppins text-m text-secondary mb-16 tracking-wide">Bulk Order System</p>

                <div class="text-left mb-6">
                    <label class="block text-xs font-semibold text-secondary mb-2 ml-1"></label>
                    <div class="relative">
                        <select id="storeSelector" class="w-full bg-[#F9F8F6] border border-lightBeige text-primary text-sm font-semibold rounded-xl py-3.5 px-4 outline-none focus:border-taupe appearance-none cursor-pointer transition">
                            <option value="" disabled selected hidden>Pilih Lokasi Store...</option>
                            <option value="MALANG - GALUNGGUNG">Malang - Galunggung</option>
                            <option value="KEDIRI - ERLANGGA">Kediri - Erlangga</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-secondary">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"></path></svg>
                        </div>
                    </div>
                </div>

                <button onclick="enterDashboard()" class="w-full bg-primary text-white font-semibold py-3.5 rounded-xl hover:opacity-90 transition shadow-md outline-none">
                    Masuk Dashboard
                </button>
            </div>
        </div>
    </div>

    <!-- =========================================
         2. LAYAR DASHBOARD UTAMA
    ========================================== -->
    <div id="mainDashboard" class="hidden flex-col min-h-screen">
        
        <!-- Header Clean & Minimalis -->
        <header class="bg-white border-b border-lightBeige px-5 py-4 flex justify-between items-center sticky top-0 z-20 w-full shadow-sm">
            <div class="flex items-center space-x-4">
                <button onclick="exitDashboard()" class="p-2 bg-[#F9F8F6] hover:bg-lightBeige rounded-lg transition flex items-center justify-center text-secondary outline-none" title="Kembali">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
                </button>
                <div>
                    <h1 id="dashboardTitle" class="text-base font-bold text-primary tracking-tight uppercase">POS KINTOUN</h1>
                    <p class="text-secondary text-[11px] font-medium tracking-wide mt-0.5">Bulk Order Dashboard</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-3 md:space-x-4">
                <div class="flex items-center space-x-1.5">
                    <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                    <span id="statusConnection" class="text-[11px] font-bold text-green-600 uppercase tracking-wider hidden md:inline-block">Online</span>
                </div>
                <button onclick="fetchOrders()" class="bg-[#F9F8F6] border border-lightBeige hover:bg-lightBeige text-primary px-4 py-2 rounded-lg text-xs font-semibold transition outline-none">
                    Refresh
                </button>
            </div>
        </header>

        <main class="flex-grow px-4 md:px-8 pt-8 pb-10">
            <!-- Grid dengan gap yang lega -->
            <div id="ordersContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8">
                <!-- Data Pesanan Muncul Di Sini -->
            </div>
        </main>
    </div>

    <!-- LOADING OVERLAY -->
    <div id="loadingOverlay" class="fixed inset-0 bg-white bg-opacity-80 backdrop-blur-sm hidden flex-col justify-center items-center z-[60]">
        <div class="w-10 h-10 border-4 border-lightBeige border-t-primary rounded-full animate-spin mb-4"></div>
        <p class="font-semibold text-primary text-sm tracking-wide">Memperbarui...</p>
    </div>

    <!-- KONFIRMASI STATUS MODAL -->
    <div id="customConfirmModal" class="fixed inset-0 bg-primary bg-opacity-40 backdrop-blur-sm hidden flex-col justify-center items-center z-[70] px-4 transition-opacity">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm overflow-hidden transform transition-all">
            <div class="p-6">
                <h3 class="text-lg font-bold text-primary mb-2">Konfirmasi Status</h3>
                <p id="confirmMessage" class="text-secondary text-sm leading-relaxed"></p>
            </div>
            <div class="bg-[#F9F8F6] px-6 py-4 flex justify-end space-x-3 border-t border-lightBeige">
                <button onclick="closeConfirmModal()" class="px-4 py-2.5 rounded-xl text-sm font-semibold text-secondary hover:bg-lightBeige transition outline-none">Batal</button>
                <button id="btnConfirmAction" class="px-5 py-2.5 rounded-xl text-sm font-semibold bg-primary text-white hover:opacity-90 transition shadow-sm outline-none">Ya, Ubah Status</button>
            </div>
        </div>
    </div>

<script>
    // URL Webhook sesuai script kamu sebelumnya
    const N8N_GET_ORDERS_URL = 'https://n8n-h238.srv1866922.hstgr.cloud/webhook/get-orders-2.0.0'; 
    const N8N_UPDATE_STATUS_URL = 'https://n8n-h238.srv1866922.hstgr.cloud/webhook/pesanan-diproses-kak-2.0.0';

    let pendingAction = null;
    let currentStoreFilter = ''; 
    let fetchInterval = null;

    function enterDashboard() {
        const selector = document.getElementById('storeSelector');
        if (!selector.value) {
            alert('Silakan pilih lokasi outlet terlebih dahulu!');
            return;
        }

        currentStoreFilter = selector.value;
        document.getElementById('dashboardTitle').innerText = `${currentStoreFilter}`;

        document.getElementById('loginScreen').classList.add('opacity-0', 'pointer-events-none');
        setTimeout(() => {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('mainDashboard').classList.remove('hidden');
            document.getElementById('mainDashboard').classList.add('flex');
            
            fetchOrders();
            fetchInterval = setInterval(fetchOrders, 10000); 
        }, 300);
    }

    function exitDashboard() {
        clearInterval(fetchInterval);
        currentStoreFilter = '';
        document.getElementById('storeSelector').value = '';
        document.getElementById('ordersContainer').innerHTML = '';

        document.getElementById('mainDashboard').classList.add('hidden');
        document.getElementById('mainDashboard').classList.remove('flex');
        
        const loginScreen = document.getElementById('loginScreen');
        loginScreen.classList.remove('hidden');
        setTimeout(() => {
            loginScreen.classList.remove('opacity-0', 'pointer-events-none');
        }, 50);
    }

    async function fetchOrders() {
        if (!currentStoreFilter) return;
        const statusBadge = document.getElementById('statusConnection');

        try {
            const response = await fetch(N8N_GET_ORDERS_URL + '?t=' + new Date().getTime(), { 
                headers: { 'Accept': 'application/json' }
            });
            const rawData = await response.json();

            const orders = rawData.map(item => ({
                id: item['ID Pesanan'],
                timestamp: item['Waktu'],
                name: item['Nama'],
                wa: item['No WA'],
                address: item['Alamat'],
                orders: item['Detail Pesanan'],
                total: parseInt(item['Total'] || 0),
                payment: item['Pembayaran'],
                store: item['Lokasi Store'] || item['Store'] || 'MALANG - GALUNGGUNG',
                status: item['Status']
            }));

            const filteredOrders = orders.filter(o => {
                return (o.store || '').toUpperCase() === currentStoreFilter.toUpperCase();
            });

            const reversedOrders = filteredOrders.reverse();
            renderOrders(reversedOrders);

            statusBadge.innerText = 'Online';
            statusBadge.classList.replace('text-red-600', 'text-green-600');
        } catch (error) {
            statusBadge.innerText = 'Offline';
            statusBadge.classList.replace('text-green-600', 'text-red-600');
        }
    }

    function renderOrders(orders) {
        const container = document.getElementById('ordersContainer');
        let activeOrdersCount = 0;
        let html = '';

        orders.forEach(order => {
            if(order.status === 'Selesai') return; 
            activeOrdersCount++;

            // Replace newline dengan <br> untuk list pesanan
            const orderListHtml = order.orders ? order.orders.replace(/\n/g, '<br>') : '';
            
            // Badge Status Minimalis
            let statusUI = order.status === 'Pesanan Masuk' 
                ? 'bg-red-50 text-red-500 border-red-100' 
                : 'bg-green-50 text-green-600 border-green-100';
            
            const safeId = order.id ? order.id.replace(/'/g, "\\'") : '';
            const safeWa = order.wa ? String(order.wa).replace(/'/g, "\\'") : '';
            const safeName = order.name ? order.name.replace(/'/g, "\\'") : '';
            const safeStore = order.store ? order.store.replace(/'/g, "\\'") : 'MALANG - GALUNGGUNG'; 

            html += `
            <div class="bg-white rounded-2xl shadow-sm border border-[#EBE8E0] flex flex-col overflow-hidden">
                
                <!-- HEADER CARD -->
                <div class="p-5 border-b border-[#F0EFEB] flex justify-between items-start bg-[#FDFDFC]">
                    <div>
                        <h4 class="font-bold text-sm text-taupe tracking-wider uppercase">${order.id || '-'}</h4>
                        <p class="text-[11px] text-coolGrey mt-0.5">${order.timestamp || '-'}</p>
                    </div>
                    <span class="px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider border ${statusUI}">${order.status || '-'}</span>
                </div>

                <!-- BODY CARD -->
                <div class="p-5 md:p-6 flex-grow">
                    
                    <!-- Nama & No WA -->
                    <div class="mb-5">
                        <h3 class="font-bold text-xl text-primary mb-1">${order.name || '-'}</h3>
                        <p class="text-secondary text-sm flex items-center">
                            <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                            ${order.wa || '-'}
                        </p>
                    </div>

                    <!-- Metode Pemesanan Block -->
                    <div class="bg-[#F8F7F5] rounded-xl p-3.5 mb-5">
                        <p class="font-bold text-[10px] text-taupe uppercase tracking-wider mb-0.5">Metode Pemesanan</p>
                        <p class="text-primary text-sm font-semibold">${order.address || '-'}</p>
                    </div>

                    <!-- List Pesanan Block (Tanpa border kiri, Line-height longgar) -->
                    <div class="mb-6">
                        <p class="font-bold text-[10px] text-taupe uppercase tracking-wider mb-2">Detail Pesanan</p>
                        <p class="text-primary text-sm font-semibold leading-relaxed tracking-wide">${orderListHtml}</p>
                    </div>
                    
                    <!-- Total Harga -->
                    <div class="pt-4 border-t border-[#F0EFEB] flex justify-between items-center">
                        <span class="text-secondary text-xs font-medium">Total (${order.payment || 'QRIS'})</span>
                        <span class="font-bold text-lg text-primary">Rp ${(order.total || 0).toLocaleString('id-ID')}</span>
                    </div>
                </div>

                <!-- ACTION BUTTON -->
                <div class="px-5 pb-5 pt-0">
                    ${order.status === 'Pesanan Masuk' ? `<button onclick="updateStatus('${safeId}', 'Sedang Diproses', '${safeWa}', '${safeName}', '${safeStore}')" class="w-full bg-primary text-white py-3 rounded-xl text-sm font-semibold hover:opacity-90 transition outline-none">Proses Pesanan</button>` : ''}
                    ${order.status === 'Sedang Diproses' ? `<button onclick="updateStatus('${safeId}', 'Selesai', '${safeWa}', '${safeName}', '${safeStore}')" class="w-full bg-secondary text-white py-3 rounded-xl text-sm font-semibold hover:bg-primary transition outline-none">Tandai Selesai & Kirim</button>` : ''}
                </div>
            </div>`;
        });

        if(activeOrdersCount === 0) {
            container.innerHTML = `<div class="col-span-full flex flex-col items-center justify-center py-20"><p class="text-coolGrey font-medium text-sm">Belum ada pesanan aktif.</p></div>`;
        } else {
            container.innerHTML = html;
        }
    }

    function closeConfirmModal() {
        document.getElementById('customConfirmModal').classList.add('hidden');
        document.getElementById('customConfirmModal').classList.remove('flex');
        pendingAction = null;
    }

    function updateStatus(orderId, newStatus, customerWA, customerName, storeLocation) {
        const modal = document.getElementById('customConfirmModal');
        const message = document.getElementById('confirmMessage');
        message.innerHTML = `Ubah status pesanan <span class="font-semibold text-primary">${orderId}</span> menjadi <span class="font-semibold text-primary">"${newStatus}"</span>?`;
        modal.classList.remove('hidden');
        modal.classList.add('flex');
        
        pendingAction = { orderId, newStatus, customerWA, customerName, storeLocation };
    }

    document.addEventListener("DOMContentLoaded", () => {
        document.getElementById('btnConfirmAction').addEventListener('click', function() {
            if(pendingAction) {
                executeStatusUpdate(pendingAction.orderId, pendingAction.newStatus, pendingAction.customerWA, pendingAction.customerName, pendingAction.storeLocation);
            }
            closeConfirmModal();
        });
    });

    async function executeStatusUpdate(orderId, newStatus, customerWA, customerName, storeLocation) {
        document.getElementById('loadingOverlay').classList.remove('hidden');
        document.getElementById('loadingOverlay').classList.add('flex');

        try {
            let formattedWA = String(customerWA).trim();
            if (formattedWA.startsWith('0')) formattedWA = '62' + formattedWA.substring(1);
            else if (!formattedWA.startsWith('62')) formattedWA = '62' + formattedWA;

            const n8nPayload = { 
                orderId: String(orderId), 
                status: String(newStatus), 
                nomor_wa: formattedWA, 
                nama: String(customerName),
                store: String(storeLocation)
            };

            const response = await fetch(N8N_UPDATE_STATUS_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(n8nPayload)
            });

            if (response.ok) {
                document.getElementById('loadingOverlay').classList.add('hidden');
                document.getElementById('loadingOverlay').classList.remove('flex');
                fetchOrders(); 
            } else {
                throw new Error("Status API: " + response.status);
            }
        } catch (error) {
            alert('Gagal update status ke n8n.');
            document.getElementById('loadingOverlay').classList.add('hidden');
            document.getElementById('loadingOverlay').classList.remove('flex');
        }
    }
</script>
</body>
</html>
